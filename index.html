<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Video Player</title>
    <style>
        /* Removes all margins and makes the background black */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Makes the video fill the available space nicely */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps original aspect ratio without cropping */
        }
    </style>
</head>
<body>

    <!-- HTML5 Video elements configured for endless looping autoplay -->
    <video id="kioskVideo" autoplay loop muted playsinline preload="auto">
        <source src="DCS.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kioskVideo');

        // Browsers require a user click anywhere on the page to trigger native full screen
        document.body.addEventListener('click', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { /* Safari / iOS support */
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { /* IE11 / Edge support */
                video.msRequestFullscreen();
            }
        });
    </script>

</body>
</html>
